server:
  port: 8090

#  hswitchscope.iottps://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring:
  application:
    name: switchscope

  config:
    import: optional:application-local.yaml

  jpa:
    show-sql: true
    open-in-view: false
    # https://stackoverflow.com/a/67678945/548473
    #  defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      #  http://docs.jboss.org/hibernate/orm/5.3/userguide/html_single/Hibernate_User_Guide.html#configurations
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        # https://stackoverflow.com/questions/21257819/what-is-the-difference-between-hibernate-jdbc-fetch-size-and-hibernate-jdbc-batc
        jdbc.batch_size: 20
    # database-platform not needed - Hibernate 7 auto-detects dialect
  datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5433/switchscope}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  # Jackson Serialization Issue Resolver
  jackson:
    mapper.default-view-inclusion: true   # https://stackoverflow.com/a/37942375/548473
    visibility:
      field: any
      getter: none
      setter: none
      is-getter: none


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # No clear-checksums here on purpose. It used to be true, which reset every stored checksum on
    # every start, so "an applied changeset is never edited" was a rule nothing checked: a changed
    # file was silently accepted and the database quietly diverged from what the changelog says was
    # applied to it. Startup now fails on such a change, which is the report. When the edit was
    # deliberate: ./mvnw liquibase:clearCheckSums, once, knowingly - or add a new changeset instead.

  # Named explicitly: see the caffeine dependency in pom.xml. Without this, Boot would pick Redis.
  # The TTL is what keeps "a row in role_permissions is the configuration" true - a grant takes
  # effect within a minute rather than at the next restart.
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=64


logging:
  level:
    root: WARN
    net.switchscope: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.cache: TRACE
    liquibase: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server.servlet:
  encoding:
    charset: UTF-8 # Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly
    enabled: true # Enable http encoding support
    force: true

springdoc.swagger-ui.path: /

# Management and monitoring
management:
  health:
    redis:
      enabled: false

switchscope:
  security:
    permission:
      # AUDIT -> SHADOW -> ENFORCE, and the path is walked: an operation role_permissions does not
      # grant is refused, and startup fails on any finding the report calls an ERROR - a permission
      # the table cannot grant, an endpoint declaring neither annotation, an endpoint AOP cannot
      # advise - wherever it is, not only inside a promoted domain. Shadow lines
      # (PERMISSION-SHADOW-DENY) stop appearing because nothing is observed any more; what to grep
      # for now is "Refusing", logged at ERROR.
      mode: ENFORCE
      # Empty, which is not the same as "nothing is enforced": a domain named here is enforced
      # whatever the mode says, so the list can only add to what mode already does - and with
      # ENFORCE there is nothing left to add. Leaving the promoted five in place would make the
      # other direction lie: dropping mode back to SHADOW would still refuse across five domains
      # while the setting says it observes.
      #
      # So the list is the way back rather than the configuration. To watch a domain instead of
      # refusing it, put mode on SHADOW and re-promote whatever must stay real:
      #
      #   enforce-domains: [catalog, location, installation, port, component]
      #
      # That is the order stage 2 promoted them in, and it is the whole model bar one: catalog gave
      # up a hasRole('ADMIN') when it was promoted and so changed who may write, the other four
      # never had one and lost no caller because both roles hold all of location, installation,
      # port and component. system was never on the list - one permission on /api/admin/**, which
      # SecurityConfig also gates by role - and mode: ENFORCE is what finally made it real.
      enforce-domains: []

# Application-specific settings
app:
  encryption:
    # Key for encrypting sensitive data (device passwords, etc.)
    # IMPORTANT: Set via environment variable in production: APP_ENCRYPTION_KEY
    # Must be at least 16 characters, recommended 32 characters for AES-256
    key: ${APP_ENCRYPTION_KEY:change-me-in-production-32chars}
