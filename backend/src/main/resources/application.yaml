server:
  port: 8090

#  hswitchscope.iottps://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring:
  application:
    name: switchscope

  config:
    import: optional:application-local.yaml

  jpa:
    show-sql: true
    open-in-view: false
    # https://stackoverflow.com/a/67678945/548473
    #  defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      #  http://docs.jboss.org/hibernate/orm/5.3/userguide/html_single/Hibernate_User_Guide.html#configurations
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        # https://stackoverflow.com/questions/21257819/what-is-the-difference-between-hibernate-jdbc-fetch-size-and-hibernate-jdbc-batc
        jdbc.batch_size: 20
    # database-platform not needed - Hibernate 7 auto-detects dialect
  datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5433/switchscope}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  # Jackson Serialization Issue Resolver
  jackson:
    mapper.default-view-inclusion: true   # https://stackoverflow.com/a/37942375/548473
    visibility:
      field: any
      getter: none
      setter: none
      is-getter: none


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    clear-checksums: true

  # Named explicitly: see the caffeine dependency in pom.xml. Without this, Boot would pick Redis.
  # The TTL is what keeps "a row in role_permissions is the configuration" true - a grant takes
  # effect within a minute rather than at the next restart.
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=64


logging:
  level:
    root: WARN
    net.switchscope: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.cache: TRACE
    liquibase: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server.servlet:
  encoding:
    charset: UTF-8 # Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly
    enabled: true # Enable http encoding support
    force: true

springdoc.swagger-ui.path: /

# Management and monitoring
management:
  health:
    redis:
      enabled: false

switchscope:
  security:
    permission:
      # AUDIT -> SHADOW -> ENFORCE. SHADOW evaluates every request and logs what it would refuse
      # without refusing anything; grep the log for PERMISSION-SHADOW-DENY. Promote one domain at a
      # time through enforce-domains, and roll it back by removing it from the list - no rebuild.
      mode: SHADOW
      # Promoted domains. role_permissions is the only gate on their routes; removing a domain from
      # this list drops it back to shadow with no rebuild - but nothing else guards those routes, so
      # the rollback is "stop refusing", not "restore the old rule".
      #
      # catalog also gave up a hasRole('ADMIN') when it was promoted, and so changed who may write.
      # The other three never had one: promoting them takes routes that any authenticated caller
      # could reach and makes them require a permission. Both roles hold all of location, installation
      # and port, so no caller loses anything today - what changes is that the decision is real.
      #
      # component is deliberately not here yet: one word would promote ComponentController and all
      # nine AbstractCrudController subclasses at once, which is 36 of the 81 permissions.
      enforce-domains: [catalog, location, installation, port]

# Application-specific settings
app:
  encryption:
    # Key for encrypting sensitive data (device passwords, etc.)
    # IMPORTANT: Set via environment variable in production: APP_ENCRYPTION_KEY
    # Must be at least 16 characters, recommended 32 characters for AES-256
    key: ${APP_ENCRYPTION_KEY:change-me-in-production-32chars}
