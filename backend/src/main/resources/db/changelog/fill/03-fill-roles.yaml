databaseChangeLog:
  - changeSet:
      id: fill-roles
      author: AALEXEEN
      comment: >
        ADMIN and USER seeded as system roles, matching the two values the Role enum had, so that
        existing user_role rows map one to one. Further roles are configuration, not a release.
      changes:
        - loadData:
            encoding: UTF-8
            separator: ;
            quotchar: ''''
            usePreparedStatements: false
            tableName: roles
            file: ../csv/03-roles.csv
            commentLineStartsWith: //
            relativeToChangelogFile: true
            columns:
              - column:
                  header: id
                  name: id
                  type: uuid
              - column:
                  header: name
                  name: name
                  type: varchar
              - column:
                  header: description
                  name: description
                  type: varchar
              - column:
                  header: code
                  name: code
                  type: varchar
              - column:
                  header: display_name
                  name: display_name
                  type: varchar
              - column:
                  header: is_active
                  name: is_active
                  type: boolean
              - column:
                  header: sort_order
                  name: sort_order
                  type: numeric
              - column:
                  header: system_role
                  name: system_role
                  type: boolean
      rollback:
        - sql:
            sql: DELETE FROM roles;
