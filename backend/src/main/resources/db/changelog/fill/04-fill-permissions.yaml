databaseChangeLog:
  - changeSet:
      id: fill-permissions
      author: AALEXEEN
      comment: >
        Generated by tools/generate_permission_seed.py from the @RequiresPermission annotations, not
        typed by hand: a code the table lacks makes an operation ungrantable, a code no endpoint uses
        is a dead row, and PermissionRegistry reports both on startup.
      changes:
        - loadData:
            encoding: UTF-8
            separator: ;
            quotchar: ''''
            usePreparedStatements: false
            tableName: permissions
            file: ../csv/04-permissions.csv
            commentLineStartsWith: //
            relativeToChangelogFile: true
            columns:
              - column:
                  header: id
                  name: id
                  type: uuid
              - column:
                  header: name
                  name: name
                  type: varchar
              - column:
                  header: description
                  name: description
                  type: varchar
              - column:
                  header: code
                  name: code
                  type: varchar
              - column:
                  header: display_name
                  name: display_name
                  type: varchar
              - column:
                  header: is_active
                  name: is_active
                  type: boolean
              - column:
                  header: sort_order
                  name: sort_order
                  type: numeric
              - column:
                  header: domain
                  name: domain
                  type: varchar
              - column:
                  header: resource
                  name: resource
                  type: varchar
              - column:
                  header: action
                  name: action
                  type: varchar
      rollback:
        - sql:
            sql: DELETE FROM permissions;
